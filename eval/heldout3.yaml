  question: How is a group e-visa application agency's rate of illegal stay calculated, and when is the rate used instead
    of the number of illegal stayers?
  answer: The rate is the number of illegal stayers in the previous month divided by the average number of people issued visas
    in the last 3 months. The rate is used when the average number of tourists in the last 3 months was 300 or more; below
    300, the number of illegal stayers is counted.
