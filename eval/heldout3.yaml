  question: What trainee requirements must an applicant meet for the D-3-11 industrial trainee (FDI) visa?
  answer: The trainee must be healthy and aged between 18 and 40, have more than 3 months of working experience at the Korean
    subsidiary, and have TOPIK level 2 or higher or a score of 50 out of 200. The TOPIK requirement does not apply to those
    with a bachelor's degree or higher from Korea, or to those training at a company that has pledged Korean language education
    of 5 hours or more a month and a full-time translator for every 100 trainees.
  gold:
  - doc: page-D-3-11
