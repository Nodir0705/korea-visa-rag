  question: What kinds of performers does the E-6-2 hotel and adult entertainment visa cover, and what visa validity and period
    of stay are granted?
  answer: People who perform or do entertainment activities at a hotel or an adult entertainment business defined in the Tourism
    Promotion Act, such as pop musicians, instrument players, circus artists or magicians. The visa is multiple-entry and
    valid for 1 year, and the stay is granted for up to 1 year.
  gold:
  - doc: page-E-6-2
- id: SA08
  type: lookup
  question: For an F-1-23 household assistant visa applied for at an embassy, what must the foreign investor employer's investment
    and company look like?
  answer: The investor must have invested $100,000 or more in a high-tech information business and hold D-8, F-2 or F-5 status,
    and must be a CEO or executive of a high-tech company with at least three Korean full-time workers.
  gold:
  - doc: page-F-1-23
