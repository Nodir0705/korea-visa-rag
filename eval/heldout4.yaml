questions:
- id: SA01
  type: lookup
  question: For a D-2-5 research student applying at an embassy, which documents can prove financial ability, and who has
    to submit the original final education document?
  answer: An original document proving financial ability, such as a bank statement or a receipt of research allowance (a family
    relation certificate is also needed if a parent's bank statement is used). The original document showing the final level
    of education is required only for those who have earned a master's degree or higher.
  gold:
  - doc: page-D-2-5
- id: SA02
  type: lookup
  question: What must a foreign company have imported for its production employees to be eligible for the D-3-13 industrial
    trainee (plant) visa?
  answer: Industrial facilities or plants worth US$500,000 or more, with the employee needing job training to manage those
    facilities or plants.
  gold:
  - doc: page-D-3-13
- id: SA03
  type: lookup
  question: Which organisation's recommendation letter does a D-4-5 Korean cuisine trainee chef need?
  answer: A recommendation letter from the Agriculture and Fisheries & Food Trade Corporation of Korea (aT).
  gold:
  - doc: page-D-4-5
- id: SA04
  type: paraphrase
  question: my companys overseas branch is sending me to the head office in seoul on a D-7-2 visa. does the dispatch order
    need to say anything specific, and do we have to hand in the HQ corporate register?
  answer: The dispatch order must indicate the period of the overseas assignment. A certified copy of the headquarters' unabridged
    Corporate Register is required, but you may be exempt from it if your company is a public corporation.
  gold:
  - doc: page-D-7-2
