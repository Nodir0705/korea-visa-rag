- id: SA13
  type: multi_hop
  question: On a D-4-2 general trainee visa, which application route does a trainee invited by the Ministry of National Defense
    use compared with an intern at a foreign investment firm, and how do their periods of stay differ?
  answer: The trainee invited by the Ministry of National Defense applies at the embassy and is granted a stay of up to 1
    year initially. The intern at a foreign investment firm applies through Confirmation of Visa Issuance and is granted a
    stay of up to 6 months. Both get a single-entry visa valid for 3 months.
  gold:
