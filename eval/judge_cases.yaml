  question: Who issues the TB certificate for someone already in Korea who applies for a change of status of stay, and how
    is that different from a visa application abroad?
  reference: In Korea (change of status, alien registration, extension) it is a certificate of confirmation issued by a Korean
    public health center; for a visa application at a mission it is a Certificate of Health from a hospital designated by
    the Korean diplomatic mission.
  answer: For someone already in Korea applying for a change of status of stay, the TB certificate is issued by a Korean public
