  question: Do registered foreign residents need a re-entry permit to return to Korea within one year?
  reference: No. Registered foreign residents departing after April 1, 2022 can re-enter within 1 year of departure without
    a re-entry permit (2 years for permanent residents).
  answer: Registered foreign residents departing after April 1, 2022 will be allowed re-entry into the ROK within one year
    from the date of departure without obtaining a Re-entry Permit in advance [1]. This exemption applies to registered foreigners
    with statuses ranging from Diplomat (A-1) through International Agreement (A-3), Korean Arts and Culture (D-1), Dependent
    Family (F-3), Marriage Migrant (F-6), Work and Visit (H-2), Permanent Resident (F-5), Overseas Korean (F-4), Holders of
    Refugee Travel Document, and nationals from Exempted Countries [2]. However, registered foreigners who departed before
    April 1, 2022 with a Re-entry Permit must enter the ROK within the granted re-entry permit period (within one year) [1].
  label: PASS
  why: ''
