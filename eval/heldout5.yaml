  type: table
  question: Which foreign doctors are eligible for an E-5 professional visa through Confirmation of Visa Issuance,
    and at which kinds of institutions may they work?
  answer: A doctor holding a foreign licence acknowledged by Korean law, recommended by the Minister of Health and
    Welfare, with advanced knowledge of the latest medical technology, who will work at a medical institution run
    by the government or a local government, a medical corporation, or a medical institution run by a non-profit
    corporation or a government-invested corporation. A graduate of a Korean medical or dental school who will do
    an internship or residency at a university-affiliated hospital or a hospital designated by the Minister of Health
    and Welfare is also eligible.
  gold:
