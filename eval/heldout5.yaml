  question: Under the (temporarily suspended) visa-free entry programme for tourists in transit to third countries,
    what conditions must a traveller meet regarding their onward ticket, past record in Korea, and stopover?
  answer: They need a confirmed onward flight ticket departing within 30 days of entering Korea and no criminal
    record such as overstay in the countries concerned. In the 3 years before entry they must not have been denied
    entry to Korea, fined more than 5 million KRW, or forcibly evicted or given a deportation order. They must not
    have stayed more than 3 days in the transit or stopover country, unless they are returning to the immediately
    previous point of departure.
