  question: Which vaccination certificates must E-9, E-10 or H-2 visa applicants submit?
  answer: 'Not in the corpus. No vaccination certificate is required anywhere. The Health & Mentality Statement
    only asks about past infectious diseases (syphilis, viral hepatitis B, tuberculosis), drugs or alcohol, mental
    disorders and serious illnesses. The closest requirement is a February 2016 notice: nationals of listed high
    TB-burden countries who live in one of those countries and apply at a Korean mission for a long-term visa (91
    days or longer) must submit a TB test certificate (a ''Certificate of Health'' from a designated hospital).
    That is a TB test, not a vaccination.'
