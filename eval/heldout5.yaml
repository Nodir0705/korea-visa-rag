  question: A foreigner plans to learn traditional Korean arts from a Korean expert and applies for the D-1 Korean
    arts and culture visa through Confirmation of Visa Issuance. What document about the expert is needed, and what
    visa and stay are granted?
  answer: A certificate of employment history of the expert. The visa is single-entry, valid for 3 months, with
