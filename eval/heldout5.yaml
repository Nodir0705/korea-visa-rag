    pages:
    - 1
- id: UA04
  type: paraphrase
  question: im chinese and my daughter (also chinese) married a korean guy 2 years ago, marriage is registered in
    both countries. can i get a multiple entry visa to visit her? how long is it good for and how long can i stay
    each time
  answer: Yes. Under C-3-1 (Short-Term General) embassy Case 2, a parent of a foreign spouse who has kept the marriage
    with a Korean national for more than a year after registering it in both countries can get a multiple-entry
    visa valid for 3 years, with stays of up to 90 days each time.
  gold:
  - doc: page-C-3-1
- id: UA05
  type: lookup
  question: A Chinese national is going to Korea briefly for market research and to sign a contract, and applies
    at the embassy for a C-3-4 business visitor visa under Case 1. What visa can they get and how long can they
    stay?
  answer: Either a single-entry visa valid for 3 months, with stays of up to 90 days, or a double-entry visa valid
    for 6 months, with stays of up to 30 days.
  gold:
  - doc: page-C-3-4
- id: UA06
  type: multi_hop
  question: For Chinese applicants, what amount of assets qualifies someone for the 3-year multiple-entry C-3-4
    business visitor visa (embassy Case 2), and what amount qualifies them for the 5-year multiple-entry C-3-9 ordinary
    tourist visa (embassy Case 3)?
  answer: For the 3-year C-3-4 visa, proven assets (real estate, financial assets, business ownership and so on)
    worth more than 5,000,000 yuan. For the 5-year C-3-9 visa, proven assets worth more than 2 million yuan.
  gold:
  - doc: page-C-3-4
  - doc: page-C-3-9
- id: UA07
  type: lookup
  question: A Chinese businessperson is invited by a company that the Ministry of Justice selected as a preferential
    company. How do they apply for the C-3-6 visa, what do they submit, and what visa validity and stay do they
    get?
  answer: They apply through Confirmation of Visa Issuance, submitting the CCVI application form (Form No. 21),
    a copy of the passport and a photo, proof of employment, and an invitation letter issued by the selected corporation
    or association. If a representative applies, they also submit a power of attorney, their employment certificate
    and a copy of their ID card. The visa is multiple-entry, valid for 1 year, with stays of up to 90 days.
  gold:
  - doc: page-C-3-6
- id: UA08
  type: table
  question: A Chinese holder of a preferential visit card applies at the embassy for C-3-9 tourist visas for herself
    and her husband (Case 2). Which documents are required, and what visa do they get?
  answer: The application form (Form No. 17), passport, photo and fee; a copy of the preferential visit card; a
    document proving qualification for the card (a bank book or certificate of bank account balance), which does
    not apply to holders of a 'preferential card without financial function'; and a document proving the family
    relationship, such as a marriage certificate, certificate of family relation records or birth certificate. They
    get a multiple-entry visa valid for 5 years, with stays of up to 90 days.
  gold:
  - doc: page-C-3-9
