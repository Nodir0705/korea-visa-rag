  question: A group e-visa application agency had an average of 400 tourists over the last 3 months, received no
    sanctions in the last 3 months, and has a rate of illegal stay of 2.5%. Which administrative sanction applies
    under Table 1 of the regulation?
  answer: Because the 3-month average is 300 or more, the rate of illegal stay is used instead of the number of
