  question: Which industries does the E-9-5 service-sector worker visa cover?
  answer: Construction waste processing; cold storage (for companies located onshore); collecting or selling reusable
    materials; publishing of books, magazines and other printed matter; and music and other audio publishing.
  gold:
  - doc: page-E-9-5
