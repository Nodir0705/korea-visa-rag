  type: lookup
  question: Someone with a bachelor's degree who completed a research program at a Korean research institution within
    the last 3 years applies for a D-10-1 job seeker visa at an embassy. Which case-specific documents do they submit,
    and what must the completion certificate show?
  answer: An education certificate, a completion certificate and a plan for seeking employment. The completion certificate
    is issued by the head of the research institution and states the research topic, research period and completion
    results.
