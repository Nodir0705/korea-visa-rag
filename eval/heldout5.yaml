questions:
- id: UA01
  type: lookup
  question: For an A-1 diplomat visa applied for at an embassy under Case 1, which family members count as the immediate
    family who can also get the visa?
  answer: The parents, spouse and child who reside in Korea together with the eligible diplomat, consular officer
    or other person with equivalent privileges.
  gold:
  - doc: page-A-1
- id: UA02
  type: lookup
  question: Under the visa-free entry scheme for foreign transfer passengers in the visa-free entry guide, what
    status and length of stay does a general transfer passenger get, and what conditions apply?
  answer: Tourist/Transit (B-2) status for 72 hours. The passenger must be transferring through Incheon Airport
    and taking part in the Transit Tourism Program on the way to a third country or their home country, hold a transfer
    ticket, and stay in the Seoul Capital Area. Citizens of the countries that need visas to enter Jeju are excluded,
    and the guide marks this scheme as temporarily suspended due to COVID-19.
  gold:
  - doc: page-B-1
  - doc: page-B-2-1
  - doc: page-B-2-2
- id: UA03
  type: multi_hop
  question: The B-2-2 Tourist/Transit (Jeju) guide says foreigners can enter Jeju without a visa. How long can they
    stay, where may they go, how must they arrive, and does anything else in the corpus change this?
  answer: The guide allows a stay of 30 days, limited to Jeju, and requires arriving by a direct international flight
    or ship to Jeju; citizens of the listed restricted countries are excluded. However, a notice that took effect
    on February 4, 2020 temporarily suspended visa-free entry to Jeju for all foreign nationals.
  gold:
  - doc: page-B-2-2
  - doc: page-B-1
  - doc: page-B-2-1
