name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Unit and service tests only: no GPU, no Ollama, no corpus (corpus tests skip themselves).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check src eval tests
      - name: Test
        run: uv run --frozen pytest -q
